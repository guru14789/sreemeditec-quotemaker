<!DOCTYPE html>
<html>
<head>
    <title>Firebase Test</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaXzKWP-AUWfDrH12TtzuG0dnxvB3_qEE",
            authDomain: "sreemeditec-35f21.firebaseapp.com",
            projectId: "sreemeditec-35f21",
            storageBucket: "sreemeditec-35f21.firebasestorage.app",
            messagingSenderId: "117300572565",
            appId: "1:117300572565:web:887143d5c209510352469c",
            measurementId: "G-L38P10TF9B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function testFirebase() {
            console.log("🔥 Testing Firebase connection...");
            
            try {
                // Try to add a test document
                console.log("📝 Attempting to save test document...");
                const docRef = await addDoc(collection(db, "quotations"), {
                    refNo: "TEST-001",
                    date: new Date().toISOString(),
                    client: { name: "Test Client", address: "Test Address", gst: "" },
                    subject: "Test Quotation",
                    products: [],
                    terms: {},
                    bankDetails: {},
                    logo: null,
                    signature: null,
                    stamp: null,
                    freight: 0,
                    freightGstRate: 18,
                    status: "draft"
                });
                console.log("✅ SUCCESS! Document saved with ID:", docRef.id);
                document.body.innerHTML = "<h1 style='color: green;'>✅ Firebase is working! Check your Firestore console.</h1>";
            } catch (error) {
                console.error("❌ ERROR:", error.code, error.message);
                document.body.innerHTML = `
                    <h1 style='color: red;'>❌ Firebase Error</h1>
                    <p><strong>Error Code:</strong> ${error.code}</p>
                    <p><strong>Message:</strong> ${error.message}</p>
                    <hr>
                    <h2>How to Fix:</h2>
                    <ol>
                        <li>Go to <a href="https://console.firebase.google.com/project/sreemeditec-35f21/firestore" target="_blank">Firebase Console</a></li>
                        <li>Click on "Firestore Database" → "Rules"</li>
                        <li>Replace with this code:</li>
                    </ol>
                    <pre style="background: #f5f5f5; padding: 10px; border-radius: 5px;">
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /quotations/{quotationId} {
      allow read, write: true;
    }
  }
}
                    </pre>
                    <p>4. Click "Publish" and reload this page</p>
                `;
            }

            try {
                console.log("📚 Attempting to read documents...");
                const querySnapshot = await getDocs(collection(db, "quotations"));
                console.log(`✅ Read successful! Found ${querySnapshot.size} documents`);
            } catch (error) {
                console.error("❌ READ ERROR:", error.code, error.message);
            }
        }

        testFirebase();
    </script>
</head>
<body>
    <h1>Testing Firebase Connection...</h1>
    <p>Check browser console (F12) for details</p>
</body>
</html>
